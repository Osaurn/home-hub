<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tehtävä — Kalle Kotiapuri</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a href="index.html" class="brand"><img class="brand-logo" src="img/logo.png" alt="" /><h1>Kalle Kotiapuri</h1></a>
    <nav>
      <a href="tasks.html" class="active">Kaikki tehtävät</a>
      <a href="history.html">Historia</a>
    </nav>
  </header>

  <main>
    <h2 id="page-title">Uusi tehtävä</h2>

    <form class="task-form" id="task-form">
      <label for="title">Otsikko</label>
      <input type="text" id="title" name="title" required />

      <div class="field-header">
        <label for="instructions">Ohjeet</label>
        <button type="button" class="btn secondary small" id="instructions-toggle">Esikatselu</button>
      </div>
      <textarea id="instructions" name="instructions" placeholder="Kirjoita ohjeet (tukee Markdown-muotoilua)"></textarea>
      <div class="instructions-preview" id="instructions-preview" style="display:none;"></div>

      <label>Toistuvuus</label>
      <div class="recurrence-toggle">
        <button type="button" id="toggle-quarterly" class="active">Vuosineljänneksittäin</button>
        <button type="button" id="toggle-monthly">Tarkka kuukausi</button>
        <button type="button" id="toggle-interval">Muutaman vuoden välein</button>
      </div>

      <div id="quarterly-fields">
        <div class="quarters-check">
          <label><input type="checkbox" name="quarter" value="1" /> Q1 (tammi–maalis)</label>
          <label><input type="checkbox" name="quarter" value="2" /> Q2 (huhti–kesä)</label>
          <label><input type="checkbox" name="quarter" value="3" /> Q3 (heinä–syys)</label>
          <label><input type="checkbox" name="quarter" value="4" /> Q4 (loka–joulu)</label>
        </div>
      </div>

      <div id="monthly-fields" style="display:none;">
        <div class="months-check">
          <label><input type="checkbox" name="month" value="1" /> Tammikuu</label>
          <label><input type="checkbox" name="month" value="2" /> Helmikuu</label>
          <label><input type="checkbox" name="month" value="3" /> Maaliskuu</label>
          <label><input type="checkbox" name="month" value="4" /> Huhtikuu</label>
          <label><input type="checkbox" name="month" value="5" /> Toukokuu</label>
          <label><input type="checkbox" name="month" value="6" /> Kesäkuu</label>
          <label><input type="checkbox" name="month" value="7" /> Heinäkuu</label>
          <label><input type="checkbox" name="month" value="8" /> Elokuu</label>
          <label><input type="checkbox" name="month" value="9" /> Syyskuu</label>
          <label><input type="checkbox" name="month" value="10" /> Lokakuu</label>
          <label><input type="checkbox" name="month" value="11" /> Marraskuu</label>
          <label><input type="checkbox" name="month" value="12" /> Joulukuu</label>
        </div>
      </div>

      <div id="interval-fields" style="display:none;">
        <div class="interval-fields">
          <div>
            <label for="interval_min_years">Väli alkaen (vuotta)</label>
            <input type="number" id="interval_min_years" min="1" />
          </div>
          <div>
            <label for="interval_max_years">Väli viimeistään (vuotta)</label>
            <input type="number" id="interval_max_years" min="1" />
          </div>
        </div>
        <div>
          <label for="interval_first_due">Ensimmäinen eräpäivä (valinnainen)</label>
          <input type="date" id="interval_first_due" />
          <p class="muted">Jos tehtävää ei ole vielä tehty, se on "Tulossa" tähän päivään asti. Tyhjä = heti ajankohtainen.</p>
        </div>
      </div>

      <h2 class="section-title">Tunnisteet</h2>
      <div class="card">
        <div class="tag-chips" id="tag-chips"></div>
        <div class="tag-add-row">
          <input type="text" id="new-tag-input" placeholder="Uusi tunniste" />
          <button type="button" class="btn secondary small" id="new-tag-btn">+ Lisää</button>
        </div>
      </div>

      <h2 class="section-title">Liitteet</h2>
      <div class="card">
        <input type="file" id="attachment-input" multiple />
        <p class="muted" id="attachment-hint">Valitut tiedostot tallentuvat, kun painat Tallenna.</p>
        <ul class="attachment-list" id="attachment-list"></ul>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn">Tallenna</button>
        <a class="btn secondary" href="tasks.html">Peruuta</a>
        <button type="button" class="btn danger" id="delete-btn" style="display:none;">Poista tehtävä</button>
      </div>
    </form>

    <div id="detail-sections" style="display:none;">
      <section>
        <h2 class="section-title">Merkitse tehdyksi</h2>
        <div class="card">
          <div class="complete-row">
            <input type="date" id="complete-date" />
            <input type="text" id="complete-note" placeholder="Muistiinpano (valinnainen)" />
            <button type="button" class="btn" id="complete-btn">Merkitse tehdyksi</button>
          </div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Historia</h2>
        <ul class="completion-list" id="completion-list"></ul>
      </section>
    </div>
  </main>

  <script src="vendor/marked.js"></script>
  <script src="js/api.js"></script>
  <script src="js/help.js"></script>
  <script src="js/taskForm.js"></script>
</body>
</html>
