<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laite — Kalle Kotiapuri</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site"></header>

  <main>
    <h2 id="page-title" class="page-title">Uusi laite</h2>

    <form class="task-form" id="equipment-form">
      <label for="name">Nimi</label>
      <input type="text" id="name" required placeholder="esim. Ilmanvaihtokone" />

      <label>Kuvake</label>
      <div class="icon-picker" id="icon-picker"></div>

      <label for="category">Tyyppi</label>
      <input type="text" id="category" list="category-options" placeholder="esim. Lämmitys, Ilmanvaihto" />
      <datalist id="category-options">
        <option value="Lämmitys"></option>
        <option value="Ilmanvaihto"></option>
        <option value="Vesi ja viemäri"></option>
        <option value="Sähkö"></option>
        <option value="Kodinkone"></option>
      </datalist>

      <label for="location">Sijainti</label>
      <input type="text" id="location" list="location-options" placeholder="esim. Tekninen tila" />
      <datalist id="location-options"></datalist>

      <label for="model">Merkki ja malli</label>
      <input type="text" id="model" />

      <label for="serial_number">Sarjanumero</label>
      <input type="text" id="serial_number" />

      <label for="purchase_date">Hankintapäivä</label>
      <input type="date" id="purchase_date" />

      <label for="warranty_expires">Takuu päättyy</label>
      <input type="date" id="warranty_expires" />

      <label for="warranty_notes">Takuun ehdot ja yhteystiedot</label>
      <textarea id="warranty_notes" style="min-height:80px;" placeholder="esim. takuunumero, myyjä, huoltopuhelin"></textarea>

      <div class="field-header">
        <label for="instructions">Ohjeet ja muistiinpanot</label>
        <button type="button" class="btn secondary small" id="instructions-toggle">Esikatselu</button>
      </div>
      <textarea id="instructions" placeholder="Omat käyttö- ja huolto-ohjeet, vinkit ja muistiinpanot (tukee Markdown-muotoilua)"></textarea>
      <div class="instructions-preview" id="instructions-preview" style="display:none;"></div>

      <h2 class="section-title">Käyttöohjeet</h2>
      <div class="card">
        <input type="file" id="manual-input" multiple />
        <p class="muted" id="manual-hint">Valitut tiedostot tallentuvat, kun painat Tallenna.</p>
        <ul class="attachment-list" id="manual-list"></ul>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn">Tallenna</button>
        <a class="btn secondary" id="cancel-link" href="equipment.html">Peruuta</a>
        <button type="button" class="btn danger" id="delete-btn" style="display:none;">Poista laite</button>
      </div>
    </form>
  </main>

  <script src="vendor/marked.js"></script>
  <script src="js/api.js"></script>
  <script src="js/backButton.js" data-fallback="equipment.html"></script>
  <script src="js/layout.js"></script>
  <script src="js/help.js"></script>
  <script src="js/equipmentIcons.js"></script>
  <script src="js/equipmentForm.js"></script>
</body>
</html>
