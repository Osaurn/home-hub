<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotihubi — Vuosikello</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <h1>🏡 Kotihubi</h1>
    <nav>
      <a href="index.html" class="active">Vuosikello</a>
      <a href="tasks.html">Kaikki tehtävät</a>
    </nav>
  </header>

  <main>
    <div class="form-actions" style="justify-content: flex-end;">
      <a class="btn" href="task-form.html">+ Lisää tehtävä</a>
    </div>

    <div class="clock-wrap"><div id="clock"></div></div>

    <section id="quarter-panel-section" style="display:none;">
      <div class="card" id="quarter-panel"></div>
    </section>

    <section id="overdue-section">
      <h2 class="section-title">Myöhässä</h2>
      <div id="overdue-list"></div>
    </section>

    <section>
      <h2 class="section-title">Tehtävät nyt</h2>
      <div id="due-list"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/help.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
