<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalle Kotiapuri — Vuosikello</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preload" href="fonts/LilitaOne-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site">
    <a href="index.html" class="brand"><img class="brand-logo" src="img/logo.png" alt="" /><h1>Kalle Kotiapuri</h1></a>
    <nav>
      <a href="tasks.html">Kaikki tehtävät</a>
      <a href="history.html">Historia</a>
    </nav>
  </header>

  <main>
    <div class="form-actions" style="justify-content: flex-end;">
      <a class="btn" href="task-form.html">+ Lisää tehtävä</a>
    </div>

    <div class="hero">
      <section id="kalle" class="kalle" aria-live="polite" hidden></section>
      <div class="clock-wrap"><div id="clock"></div></div>
    </div>

    <section id="quarter-panel-section" style="display:none;">
      <div class="card" id="quarter-panel"></div>
    </section>

    <section id="overdue-section">
      <h2 class="section-title">Myöhässä</h2>
      <div id="overdue-list"></div>
    </section>

    <section>
      <h2 class="section-title">Tehtävät nyt</h2>
      <div id="due-list"></div>
    </section>

    <section>
      <h2 class="section-title">Viimeksi tehdyt</h2>
      <div id="recent-history-list"></div>
      <div class="form-actions" style="justify-content: flex-end; margin-top: 10px;">
        <a class="btn secondary small" href="history.html">Näytä koko historia →</a>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/help.js"></script>
  <script src="js/kalleMood.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
